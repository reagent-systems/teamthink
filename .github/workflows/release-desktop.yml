name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & build static site
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install desktop deps & package
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --linux AppImage deb tar.gz
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teamthink-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile && pnpm build
      - working-directory: desktop
        run: |
          npm install
          npx electron-builder --mac dmg zip
      - uses: actions/upload-artifact@v4
        with:
          name: teamthink-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile && pnpm build
      - working-directory: desktop
        run: |
          npm install
          npx electron-builder --win nsis zip
      - uses: actions/upload-artifact@v4
        with:
          name: teamthink-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
