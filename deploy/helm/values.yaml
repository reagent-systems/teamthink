replicaCount: 1

image:
  worker:
    repository: teamthink/worker
    tag: "0.15.0"
  web:
    repository: nginx
    tag: alpine

service:
  worker:
    port: 8787
  web:
    port: 80

ingress:
  enabled: false
  host: teamthink.local

auth:
  secret: change-me

airgap:
  enabled: false
  modelMirrorPath: /data/models

dataResidency:
  region: us-default
  meshOnly: false
